spring:
  application:
    name: sample-specification-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sample-specification}
    username: ${DB_USER:sample}
    password: ${DB_PASSWORD:sample}
  jpa:
    open-in-view: false
  flyway:
    schemas: public
  data:
    web:
      pageable:
        # Stable page JSON: {"content": [...], "page": {"size", "number", "totalElements", "totalPages"}}
        serialization-mode: via-dto
