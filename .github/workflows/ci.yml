name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs are canceled; a run on master is never canceled mid-run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # TEMPORARY: spring-specification-tools 1.0.0 is not on Maven Central yet, so it is built from this commit.
  # Remove this variable and the two "spring-specification-tools" steps once 1.0.0 is released, and change the
  # Maven cache key (any pom.xml change does it) so no cached copy of this local build is restored.
  SPRING_SPECIFICATION_TOOLS_SHA: 6af2d0657611b7c3d303401fee572e81141a4bb8

jobs:
  build:
    name: Build and test (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # TEMPORARY (see SPRING_SPECIFICATION_TOOLS_SHA).
      - name: Check out spring-specification-tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fagnerlima/spring-specification-tools
          ref: ${{ env.SPRING_SPECIFICATION_TOOLS_SHA }}
          path: spring-specification-tools
          persist-credentials: false

      # TEMPORARY (see SPRING_SPECIFICATION_TOOLS_SHA).
      - name: Install spring-specification-tools 1.0.0 from source
        working-directory: spring-specification-tools
        run: ./mvnw -B -ntp -DskipTests -Drevision=1.0.0 install

      # The integration tests use Testcontainers and the runner's Docker daemon.
      - name: Build and verify
        run: ./mvnw -B -ntp verify
